# V4 single-server private integration. Run with explicit --env-file.
name: jinshu-v4
x-runtime: &runtime
  build: {context: ../.., dockerfile: Dockerfile.services}
  env_file: .env
  environment: &env
    JINSHU_PROFILE: services
    JINSHU_EMBEDDED_WORKER: "0"
    MONGODB_URI: mongodb://jinshu:${MONGO_PASSWORD:?run init_deployment.py}@mongodb:27017/jinshu?authSource=admin
    REDIS_ADDR: redis://:${REDIS_PASSWORD:?run init_deployment.py}@redis:6379
    MILVUS_URI: http://milvus:19530
    PI_AGENT_URL: http://pi-agent:8100
  volumes: ["workspace:/app/workspace", "${PRIVATE_CORPUS_PATH:-../../private_corpus}:/app/private_corpus:ro"]
  restart: unless-stopped
  depends_on:
    mongodb: {condition: service_healthy}
    redis: {condition: service_healthy}
    milvus: {condition: service_healthy}
services:
  mongodb:
    image: mongo:7.0
    environment: {MONGO_INITDB_ROOT_USERNAME: jinshu, MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?required}"}
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u jinshu -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD:?required}"}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment: {ETCD_AUTO_COMPACTION_MODE: revision, ETCD_AUTO_COMPACTION_RETENTION: "1000", ETCD_QUOTA_BACKEND_BYTES: "4294967296", ETCD_SNAPSHOT_COUNT: "50000"}
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd_data:/etcd"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment: {MINIO_ROOT_USER: "${MINIO_USER:?required}", MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?required}"}
    command: minio server /minio_data --console-address ':9001'
    volumes: ["minio_data:/minio_data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 30
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_USER:?required}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:?required}"
      COMMON_STORAGETYPE: remote
    volumes: ["milvus_data:/var/lib/milvus"]
    restart: unless-stopped
    depends_on: {etcd: {condition: service_healthy}, minio: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 60s
      retries: 30
  model-gateway:
    profiles: [local-models]
    build: ../../services/model-gateway
    env_file: .env
    environment: {HF_HOME: /models, MODEL_DEVICE: cpu, MODEL_THREADS: "2"}
    volumes: ["model_cache:/models"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      retries: 15
  api:
    <<: *runtime
    ports: ["127.0.0.1:8766:8766"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8766/ready"]
      interval: 15s
      start_period: 60s
      retries: 10
  worker:
    <<: *runtime
    command: ["python", "-m", "jinshu", "worker", "--profile", "services"]
  manage:
    <<: *runtime
    profiles: [tools]
    restart: "no"
    command: ["python", "scripts/manage_services.py", "--help"]
  pi-agent:
    profiles: [pi]
    build: ../../engine/services/pi-agent
    env_file: .env
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      BACKEND_URL: http://api:8766
      DEEPSEEK_BASE_URL: "${CHAT_BASE_URL}"
      DEEPSEEK_API_KEY: "${CHAT_API_KEY}"
      DEEPSEEK_MODEL: "${CHAT_MODEL}"
    restart: unless-stopped
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prom_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
volumes:
  mongo_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  model_cache:
  workspace:
  prom_data:
