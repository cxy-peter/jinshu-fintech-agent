name: Unified V8 verification
on:
  push:
    branches: ['main', 'upgrade/unified-v8-runtime']
  pull_request:
    paths: ['unified/**','jinshu/**','tests/**','scripts/**','requirements.txt','pyproject.toml','vercel.json','.github/workflows/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: unified-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Manual deployment safety tests
        run: node --test tests/manual_deploy.test.mjs
      - name: Complete Python dependencies and regressions
        run: |
          set -euo pipefail
          mkdir -p evidence/unified-v8
          pip install -r requirements.txt pytest pytest-asyncio playwright
          pip freeze > evidence/unified-v8/dependencies.txt
          PYTHONPATH=engine/backend:. pytest -q | tee evidence/unified-v8/python-tests.txt
          node --check unified/web/app.js
          python scripts/build_unified.py
      - name: Preserve historical web regression separately
        run: |
          set -euo pipefail
          cd lite
          npm ci --ignore-scripts
          npm test | tee ../evidence/unified-v8/historical-node-tests.txt
      - name: Browser over actual local HTTP
        run: |
          python -m playwright install --with-deps chromium
          PYTHONPATH=engine/backend:.:tests uvicorn v8_browser_fixture:app --port 8091 > /tmp/fixture.log 2>&1 &
          PYTHONPATH=engine/backend:. uvicorn index:app --port 8092 > /tmp/unified.log 2>&1 &
          sleep 4
          python tests/browser_unified_v8.py
      - name: Start isolated Mongo Redis Milvus for complete runtime contracts
        run: |
          python scripts/init_deployment.py
          docker compose --env-file deploy/compose/.env -f deploy/compose/stack.yml -f tests/services_v8.yml up -d --wait --wait-timeout 240 mongodb redis milvus
      - name: Complete service runtime and durable restart verification
        run: |
          set -euo pipefail
          PYTHONPATH=engine/backend:.:tests python tests/services_v8.py | tee evidence/unified-v8/services-tests.txt
      - name: Remove isolated test services
        if: always()
        run: docker compose --env-file deploy/compose/.env -f deploy/compose/stack.yml -f tests/services_v8.yml down -v || true
      - name: Export exact source without fonts or credentials
        if: always()
        run: |
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/jinshu-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in files:
              p=Path(f)
              if p.is_file() and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'}:
                z.write(p,f)
          Path('evidence/unified-v8').mkdir(parents=True,exist_ok=True)
          Path('evidence/unified-v8/source-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshu-unified-v8
          path: |
            /tmp/jinshu-source.zip
            evidence/unified-v8/
