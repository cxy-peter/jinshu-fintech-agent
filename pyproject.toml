[project]
name = "jinshu-unified-workbench"
version = "10.2.1"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "numpy==2.5.3",
  "onnxruntime==1.30.0",
  "tokenizers==0.23.2",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "pymongo==4.18.2",
  "redis==6.4.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.fastapi.static]
cdn = false
