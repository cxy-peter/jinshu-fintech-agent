name: Recover interrupted source upload
on:
  push:
    paths: ['.github/workflows/recover-interrupted-upload.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete entries from uploaded capsule prefix
        run: |
          python - <<'PY'
          import base64,json,lzma,pathlib,hashlib
          root=pathlib.Path.cwd()
          parts=sorted((root/'_bootstrap').glob('source-*.b64'))
          text=''.join(p.read_text().strip() for p in parts)
          raw=base64.b64decode(text[:len(text)//4*4])
          decoder=lzma.LZMADecompressor()
          decoded=decoder.decompress(raw).decode('utf-8',errors='ignore')
          j=json.JSONDecoder(); pos=decoded.find('{')+1; recovered={}
          while pos>0 and pos<len(decoded):
              while pos<len(decoded) and decoded[pos] in ' \n\r\t,':pos+=1
              try:
                  name,end=j.raw_decode(decoded,pos)
                  pos=end
                  while pos<len(decoded) and decoded[pos] in ' \n\r\t:':pos+=1
                  content,end=j.raw_decode(decoded,pos)
              except (ValueError,IndexError):break
              if not isinstance(name,str) or not isinstance(content,str):break
              p=pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or '.git' in p.parts:raise ValueError('invalid entry')
              recovered[name]=content; pos=end
          dest=root/'recovered';dest.mkdir()
          for name,content in recovered.items():
              p=dest/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          manifest={'recovered_files':len(recovered),'archive_complete':decoder.eof,'parts':len(parts),'last_entry':list(recovered)[-1] if recovered else None}
          (root/'recovery-summary.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: interrupted-source-recovery
          include-hidden-files: true
          path: |
            recovered/
            recovery-summary.json
