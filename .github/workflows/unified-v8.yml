name: Unified V8 verification
on:
  push:
    branches: ['upgrade/unified-v8-runtime']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: unified-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked public source without font files
        run: |
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('/tmp/jinshu-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in files:
              p=Path(f)
              if p.is_file() and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2'}:
                z.write(p,f)
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Unified tests when source is present
        run: |
          if [ -f unified/requirements.txt ]; then
            pip install -r unified/requirements.txt pytest pytest-asyncio
            PYTHONPATH=engine/backend:. pytest -q tests/test_unified_v8.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshu-unified-source
          path: /tmp/jinshu-source.zip
