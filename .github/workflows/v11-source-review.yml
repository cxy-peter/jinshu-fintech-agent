name: V11 source review snapshot
on:
  push:
    branches: ['upgrade/v11-reliable-wealth-workflows']
    paths: ['.github/workflows/v11-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: cxy-peter/Intern-Python4WealthProduct
          path: _wealth_reference
          persist-credentials: false
      - name: Snapshot tracked source only; exclude credentials and font assets
        run: |
          python - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          roots={'jinshu':Path('.'),'wealth':Path('_wealth_reference')}
          manifest={}
          with zipfile.ZipFile('/tmp/jinshu-v11-baseline.zip','w',zipfile.ZIP_DEFLATED) as z:
              for label,root in roots.items():
                  manifest[label]=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
                  for name in subprocess.check_output(['git','-C',str(root),'ls-files','-z'],text=True).split('\0'):
                      if not name:continue
                      p=root/name
                      if not p.is_file() or p.is_symlink():continue
                      if p.suffix.lower() in {'.ttf','.otf','.woff','.woff2','.db','.sqlite','.sqlite3','.pem','.key'}:continue
                      if p.name=='.env' or p.name.startswith('.env.') and 'example' not in p.name:continue
                      z.write(p,label+'/'+name)
              z.writestr('SOURCE_COMMITS.json',json.dumps(manifest,indent=2))
          print('Prepared source-only baseline; no production data or credentials accessed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jinshu-v11-baseline
          path: /tmp/jinshu-v11-baseline.zip
          retention-days: 3
