name: Recover complete source entries
on:
  push:
    paths: ['.github/workflows/recover-complete-entries.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete JSON entries only
        run: |
          python - <<'PY'
          import base64,json,lzma,pathlib
          root=pathlib.Path.cwd(); out=root/'recovery';out.mkdir(); summary=[]
          for prefix in ('source','final'):
              parts=sorted((root/'_bootstrap').glob(prefix+'-*.b64'))
              raw=base64.b64decode(''.join(p.read_text().strip() for p in parts))
              decoder=lzma.LZMADecompressor()
              text=decoder.decompress(raw).decode('utf-8',errors='ignore')
              j=json.JSONDecoder();pos=text.find('{')+1; entries={}
              while 0<pos<len(text):
                  while pos<len(text) and text[pos] in ' \n\r\t,':pos+=1
                  try:
                      name,pos=j.raw_decode(text,pos)
                      while pos<len(text) and text[pos] in ' \n\r\t:':pos+=1
                      content,pos=j.raw_decode(text,pos)
                  except ValueError:break
                  if not isinstance(name,str) or not isinstance(content,str):break
                  path=pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:raise ValueError(name)
                  entries[name]=content
                  p=out/prefix/path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
              summary.append({'prefix':prefix,'count':len(entries),'last':list(entries)[-1] if entries else None,'complete':decoder.eof})
          (out/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-prefix-recovery
          path: recovery/
          include-hidden-files: true
